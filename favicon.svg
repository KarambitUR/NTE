<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a7a" />
      <stop offset="100%" stop-color="#bd00ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle with neon border -->
  <circle cx="50" cy="50" r="45" fill="#07060c" stroke="url(#neonGrad)" stroke-width="5" />
  
  <!-- Terminal cursor symbol >_ with cyan neon glow -->
  <path d="M32 35 L52 50 L32 65" fill="none" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <line x1="58" y1="65" x2="72" y2="65" stroke="#ff2a7a" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
</svg>
