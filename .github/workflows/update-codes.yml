name: Auto Update Promo Codes

on:
  schedule:
    # Run every 6 hours to catch new codes quickly
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual triggers from GitHub Actions UI

jobs:
  update-codes:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Allows pushing the updated codes.json back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase Admin SDK
        run: npm install firebase-admin

      - name: Run Codes Scraper (with Firestore sync)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scraper.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codes.json
          # Check if there are actual changes before committing to avoid empty commits failing the build
          if git diff --cached --quiet; then
            echo "No new promo codes found today."
          else
            git commit -m "chore: auto-update promo codes [skip ci]"
            git push
          fi
