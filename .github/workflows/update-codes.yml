name: Auto Update Promo Codes

on:
  schedule:
    # Run every day at midnight (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggers from GitHub Actions UI

jobs:
  update-codes:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Allows pushing the updated codes.json back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-node: '20'

      - name: Run Codes Scraper
        run: node scraper.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codes.json
          # Check if there are actual changes before committing to avoid empty commits failing the build
          if git diff --cached --quiet; then
            echo "No new promo codes found today."
          else
            git commit -m "chore: auto-update promo codes [skip ci]"
            git push
          fi
