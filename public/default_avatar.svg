<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a" />
      <stop offset="50%" stop-color="#181b29" />
      <stop offset="100%" stop-color="#090a10" />
    </linearGradient>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#bgGrad)" rx="24" />
  
  <!-- Outer Tech Hexagon / Circle -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#cyberNeon)" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.4" />
  <circle cx="100" cy="100" r="76" fill="none" stroke="url(#glowRing)" stroke-width="2" opacity="0.7" />
  
  <!-- Holographic Silhouette Base -->
  <g filter="url(#neonGlow)">
    <!-- Head -->
    <circle cx="100" cy="72" r="30" fill="#20263d" stroke="url(#cyberNeon)" stroke-width="2" />
    <!-- Shoulders / Torso -->
    <path d="M 50 155 C 50 118, 72 110, 100 110 C 128 110, 150 118, 150 155 Z" fill="#1b2034" stroke="url(#cyberNeon)" stroke-width="2" />
  </g>
  
  <!-- Anomaly Visor / Cyber Accent -->
  <path d="M 85 70 Q 100 76 115 70" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)" />
  <circle cx="100" cy="132" r="4" fill="#00f2fe" filter="url(#neonGlow)" />
  
  <!-- Tech Crosshairs / Badges -->
  <line x1="100" y1="18" x2="100" y2="28" stroke="#00f2fe" stroke-width="2" opacity="0.8" />
  <line x1="100" y1="172" x2="100" y2="182" stroke="#00f2fe" stroke-width="2" opacity="0.8" />
  <line x1="18" y1="100" x2="28" y2="100" stroke="#00f2fe" stroke-width="2" opacity="0.8" />
  <line x1="172" y1="100" x2="182" y2="100" stroke="#00f2fe" stroke-width="2" opacity="0.8" />
  
  <!-- Eibon Anomaly Terminal Tag -->
  <text x="100" y="186" text-anchor="middle" fill="#00f2fe" font-size="9" font-family="'Space Grotesk', monospace" letter-spacing="2" opacity="0.7">EIBON CLASSIFIED</text>
</svg>
